<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LSAT Swipe">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>LSAT Swipe</title>
<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --r:16px;--tab-h:64px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,Georgia,serif;
}
:root[data-theme=dark]{
  --bg:#0B0D10;--s1:#14171C;--s2:#1C2027;--s3:#252A33;--line:#2A303A;
  --tx:#ECEFF4;--tx2:#C3C9D3;--mu:#8E97A4;
  --ac:#8EA2FF;--ac-ink:#0B0D10;--ac-bg:rgba(142,162,255,.14);
  --xp:#F5B84B;--xp-bg:rgba(245,184,75,.14);
  --ok:#3DD68C;--ok-bg:rgba(61,214,140,.13);--bad:#FF6B6B;--bad-bg:rgba(255,107,107,.13);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F6F7F9;--s1:#FFFFFF;--s2:#EEF0F4;--s3:#E2E6EC;--line:#DDE1E8;
  --tx:#11151B;--tx2:#323A46;--mu:#677284;
  --ac:#3E55D6;--ac-ink:#FFFFFF;--ac-bg:rgba(62,85,214,.10);
  --xp:#B9770E;--xp-bg:rgba(185,119,14,.12);
  --ok:#14915A;--ok-bg:rgba(20,145,90,.11);--bad:#D23B3B;--bad-bg:rgba(210,59,59,.10);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#view{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(var(--safe-t) + 14px) 16px calc(var(--tab-h) + var(--safe-b) + 20px);display:flex;flex-direction:column;gap:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabs .in{display:flex;width:100%;max-width:560px}
#tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.02em}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--tx)}
#tabs button.on svg{color:var(--ac)}
.vh{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.vh h1{font-size:28px;font-weight:750;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:14px;line-height:1.45}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;font-size:17px;font-weight:700;letter-spacing:-.01em;transition:transform .12s,opacity .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--ac);color:var(--ac-ink)}
.btn.primary:disabled{opacity:.35}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn .bsub{font-weight:500;font-size:13px;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--s2);font-weight:700;font-size:15px}
.chip svg{width:18px;height:18px}
.chip.fire{background:var(--xp-bg);color:var(--xp)}
.chip.dim{color:var(--mu)}

/* ---------- home ---------- */
.goal{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--s3)}.ring .val{stroke:var(--ac);transition:stroke-dashoffset .6s ease}
.ring.done .val{stroke:var(--ok)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-size:30px;font-weight:750;letter-spacing:-.02em}
.ring .lbl span{font-size:12px;color:var(--mu)}
.kv{display:grid;grid-template-columns:1fr;gap:10px;flex:1}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.kv div span{color:var(--mu)}
.kv div b{font-weight:700}
.kv .xpv{color:var(--xp)}
.cta{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.cta .btn.primary{min-height:68px;flex-direction:column;gap:2px}
.suggest{display:flex;align-items:center;justify-content:space-between;gap:12px}
.suggest .t{font-size:15px;line-height:1.4}
.suggest .t span{color:var(--mu);display:block;font-size:13px}
.suggest button{flex:none;height:44px;padding:0 16px;border-radius:12px;background:var(--ac-bg);color:var(--ac);font-weight:700}
.err{color:var(--bad)}

/* ---------- feed ---------- */
#feed{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.ftop{flex:none;padding:calc(var(--safe-t) + 6px) 12px 6px;display:flex;align-items:center;gap:10px;max-width:680px;width:100%;margin:0 auto}
.ftop .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--mu)}
.ftop .x svg{width:22px;height:22px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--s3);transition:background .3s}
.segs i.ok{background:var(--ok)}.segs i.bad{background:var(--bad)}.segs i.cur{background:var(--tx2)}
.ftime{min-width:56px;text-align:right;font-weight:700;font-size:15px;color:var(--mu)}
.ftime.over{color:var(--bad)}
.tbar{height:2px;background:transparent;max-width:680px;width:100%;margin:0 auto}
.tbar i{display:block;height:100%;background:var(--ac);transition:width .25s linear}
.tbar.over i{background:var(--bad)}
#deck{position:relative;flex:1;overflow:hidden}
.card{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s ease;will-change:transform}
.card.enter{transform:translateY(55%);opacity:0}
.card.leave{transform:translateY(-35%) scale(.97);opacity:0;pointer-events:none}
.card.drag{transition:none}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 18px calc(130px + var(--safe-b))}
.inner{max-width:640px;margin:0 auto}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.pill{height:28px;display:inline-flex;align-items:center;padding:0 11px;border-radius:999px;background:var(--ac-bg);color:var(--ac);font-weight:700;font-size:13px}
.badge{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:var(--xp-bg);color:var(--xp);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--s3)}
.dots i.f{background:var(--tx2)}
.qid{margin-left:auto;color:var(--mu);font-size:12px;font-weight:600}
.stim{font-family:var(--serif);font-size:18.5px;line-height:1.62;color:var(--tx)}
.stim p+p{margin-top:12px}
.stim.rc{font-size:17.5px;line-height:1.6}
.stim h5{font-family:var(--sans);font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:18px 0 6px}
.stim h5:first-child{margin-top:0}
.rchead{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.rchead button{height:36px;padding:0 12px;border-radius:10px;background:var(--s2);color:var(--tx);font-size:13px;font-weight:700;text-transform:none;letter-spacing:0}
.badge.real{background:var(--ok-bg);color:var(--ok)}
.stem{margin:20px 0 16px;font-size:16.5px;line-height:1.5;font-weight:650;color:var(--tx)}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:56px;padding:13px 14px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);font-size:16px;line-height:1.45;color:var(--tx2);transition:border-color .15s,background .15s,opacity .2s}
.ch .k{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--s2);font-weight:750;font-size:14px;color:var(--tx);margin-top:-2px}
.ch .t{flex:1}
.ch.sel{border-color:var(--ac);background:var(--ac-bg);color:var(--tx)}
.ch.sel .k{background:var(--ac);color:var(--ac-ink)}
.ch.locked{cursor:default}
.ch.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--tx)}
.ch.ok .k{background:var(--ok);color:#06140D}
.ch.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--tx)}
.ch.bad .k{background:var(--bad);color:#1A0606}
.ch.dim{opacity:.55}
.trap{display:inline-block;margin-top:6px;font-family:var(--sans);font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--s2);color:var(--mu)}
.ch.bad .trap{background:var(--bad);color:#1A0606}
.commit,.reveal{margin-top:22px;display:flex;flex-direction:column;gap:12px;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.commit h4,.reveal h4{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:50px;border-radius:12px;background:var(--s1);border:1.5px solid var(--line);font-weight:700;font-size:15px}
.seg button.on{border-color:var(--ac);background:var(--ac-bg);color:var(--ac)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{min-height:50px;padding:8px 10px;border-radius:12px;background:var(--s1);border:1.5px solid var(--line);font-weight:600;font-size:14px;line-height:1.25;text-align:center}
.chips button.on{border-color:var(--ac);background:var(--ac-bg);color:var(--ac)}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:14px;font-size:18px;font-weight:750}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{font-size:14px;font-weight:700;color:var(--xp)}
.verdict .vs{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-top:2px}
.box{padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:15.5px;line-height:1.55;color:var(--tx2)}
.box b{color:var(--tx)}
.box.trapbox{border-color:var(--bad);background:var(--bad-bg)}
.box.trapbox .tn{font-size:17px;font-weight:750;color:var(--tx);margin:2px 0 4px}
.box.note{border-color:var(--xp);background:var(--xp-bg);color:var(--tx)}
.expl p+p{margin-top:9px}
.expl .wl{display:flex;gap:10px}
.expl .wl b{flex:none;width:18px}
.srs{font-size:13.5px;color:var(--mu);text-align:center;padding:2px 0}
.swipehint{text-align:center;color:var(--mu);font-size:13px;margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:4px}
.swipehint svg{width:20px;height:20px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.actionbar{position:absolute;left:0;right:0;bottom:0;padding:26px 16px calc(14px + var(--safe-b));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.actionbar .btn{max-width:640px;margin:0 auto}
.xpfloat{position:absolute;right:24px;bottom:calc(92px + var(--safe-b));font-weight:800;font-size:22px;color:var(--xp);pointer-events:none;animation:xpf 1.3s ease forwards}
@keyframes xpf{0%{opacity:0;transform:translateY(10px) scale(.9)}15%{opacity:1;transform:translateY(0) scale(1.05)}100%{opacity:0;transform:translateY(-46px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* summary */
.sum h2{font-size:30px;font-weight:780;letter-spacing:-.02em;margin:10px 0 4px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.big3 div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.big3 b{display:block;font-size:24px;font-weight:780}
.big3 span{font-size:12px;color:var(--mu)}
.misslist{display:flex;flex-direction:column;gap:8px}
.misslist div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 12px;background:var(--s1);border-radius:12px;border:1px solid var(--line)}
.misslist span{color:var(--mu);text-align:right}

/* ---------- skills ---------- */
.fam{display:flex;flex-direction:column;gap:10px}
.fam>h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:8px}
.fam>h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac)}
.branch{margin-left:4px;padding-left:16px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.node{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left}
.node::before{content:"";position:absolute;left:-17px;top:50%;width:15px;height:2px;background:var(--line)}
.node .nm{flex:1;min-width:0}
.node .nm b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.node .nm span{font-size:12.5px;color:var(--mu)}
.lv{flex:none;text-align:right}
.lv b{display:block;font-size:13px;font-weight:750;color:var(--ac)}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:5px;border-radius:2px;background:var(--s3)}
.pips i.f{background:var(--ac)}
.node.lock{opacity:.45}
.node.lock .lv b{color:var(--mu)}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:26px;font-weight:780;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--mu)}
.rows{display:flex;flex-direction:column;gap:12px}
.row .top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:6px}
.row .top span{color:var(--mu);white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.bar.bad i{background:var(--bad)}
.row p{font-size:13px;color:var(--mu);margin-top:5px;line-height:1.4}
.chart svg{width:100%;height:auto;display:block}
.chart .cb{fill:var(--mu);opacity:.4}.chart .cg{stroke:var(--mu);stroke-dasharray:3 4;stroke-width:1}
.chart .cl{stroke:var(--ac);stroke-width:2.2;fill:none}.chart .cd{fill:var(--ac)}
.chart text{fill:var(--mu);font-size:10px;font-family:var(--sans)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mu);font-size:14px;line-height:1.5}

/* ---------- settings ---------- */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.set+.set{border-top:1px solid var(--line)}
.set .l{font-size:16px;font-weight:600}
.set .l span{display:block;font-size:13px;font-weight:400;color:var(--mu);margin-top:2px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--s2);font-size:22px;font-weight:600}
.step b{min-width:52px;text-align:center;font-size:17px}
.segsm{display:flex;background:var(--s2);border-radius:12px;padding:3px}
.segsm button{height:40px;min-width:52px;padding:0 10px;border-radius:9px;font-weight:650;font-size:14px;color:var(--mu)}
.segsm button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog{width:56px;height:34px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--ok)}
.tog.on::after{transform:translateX(22px)}
.stack{display:flex;flex-direction:column;gap:10px}
.fine{font-size:12.5px;color:var(--mu);line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav id="tabs" aria-label="Main"><div class="in">
  <button data-a="tab:home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>Home</button>
  <button data-a="tab:skills" data-tab="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 7.2v9.6M6 12h9.8"/></svg>Skills</button>
  <button data-a="tab:stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-a="tab:settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>

<section id="feed" hidden aria-label="Question feed">
  <div class="ftop">
    <button class="x" data-a="close" aria-label="Close session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="segs" id="segs"></div>
    <div class="ftime tnum" id="ftime"></div>
  </div>
  <div class="tbar" id="tbar"><i></i></div>
  <div id="deck"></div>
</section>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>

<script>
'use strict';
/* =========================================================
   LSAT Swipe v1 — single-file app. Data lives in questions.json.
   ========================================================= */
const APP_VERSION = '1.1.0';
const OWNED_KEY = 'lsatswipe.owned.v1';   // private question file, stored on this device only
const KEY = 'lsatswipe.v1';
const INTERVALS = [1, 3, 7, 21];            // spaced-repetition days by stage
const CONF = ['Sure', '50/50', 'Guess'];      // matches Taxonomy "Confidence"
const WHY = ['Matched my prediction', 'Eliminated the other four', 'Sounded best / gut feel', 'Recognized the pattern', 'Ran short on time', 'Pure guess'];
const XP = { correct: 10, sureBonus: 5, session: 5, goal: 20 };
const VOL_TIERS = [1, 5, 10, 20, 35];         // answered → level cap
const ACC_TIERS = [0, .5, .6, .7, .85];       // accuracy (last 20) → level cap

/* ---------- Taxonomy (from LSAT_Study_Templates · Taxonomy tab) ---------- */
const TYPE_INFO = {
  'Flaw': { asks: "Identify the error in the argument's reasoning.", approach: 'Name the gap before reading choices; match the description, not the topic.' },
  'Necessary Assumption': { asks: 'Find what the argument requires to be true.', approach: "Negation test: if negating it wrecks the argument, it's necessary." },
  'Sufficient Assumption': { asks: 'Find what would make the conclusion follow logically.', approach: 'Bridge the new term in the conclusion to the premises; can be stronger than needed.' },
  'Strengthen': { asks: 'Pick the answer that most supports the argument.', approach: 'Shore up the assumption or rule out an alternative explanation.' },
  'Weaken': { asks: 'Pick the answer that most undermines the argument.', approach: 'Attack the assumption; alternative causes are common.' },
  'Must Be True / Inference': { asks: 'Pick what is guaranteed by the stimulus.', approach: 'No conclusion to attack; stay strictly within the text.' },
  'Most Strongly Supported': { asks: 'Pick what the stimulus best supports (softer inference).', approach: 'Prefer modest, hedged answers over extreme ones.' },
  'Main Point': { asks: "Identify the argument's main conclusion.", approach: 'Ask which claim the others support.' },
  'Role of a Statement': { asks: 'Identify the job a quoted claim plays.', approach: 'Label it: conclusion, intermediate conclusion, premise, background, counterpoint.' },
  'Method of Reasoning': { asks: 'Describe how the argument proceeds.', approach: 'Describe abstractly, then match each word of the answer.' },
  'Point at Issue (Disagree)': { asks: 'Find what two speakers disagree about.', approach: 'Both must hold an opinion on it, and opposite ones.' },
  'Point of Agreement': { asks: 'Find what two speakers both accept.', approach: 'Each speaker must have committed to it.' },
  'Parallel Reasoning': { asks: 'Match the logical structure of the stimulus.', approach: 'Compare conclusion type and certainty first, then structure.' },
  'Parallel Flaw': { asks: 'Match the flawed structure of the stimulus.', approach: 'Identify the flaw first; the answer must share it.' },
  'Principle (Apply)': { asks: 'Apply a stated principle to a case.', approach: 'Check every condition of the principle against the case.' },
  'Principle (Justify)': { asks: 'Find the principle that supports the argument.', approach: 'Treat like a sufficient assumption in general form.' },
  'Resolve / Explain': { asks: 'Explain an apparent paradox or discrepancy.', approach: 'The answer lets both facts be true together.' },
  'Evaluate': { asks: 'Find the question whose answer would test the argument.', approach: 'Answers on both sides of the question should move the argument.' },
  'Conditional Logic': { asks: 'Any question hinging on if/then chains.', approach: 'Diagram, then use the contrapositive; watch for reversals.' },
  'RC: Main Point / Primary Purpose': { asks: "The passage's central idea or the author's aim." },
  "RC: Author's Attitude": { asks: "The author's tone or stance toward a subject." },
  'RC: Detail / Specific Reference': { asks: 'What the passage explicitly says.' },
  'RC: Inference': { asks: 'What the passage implies but does not state.' },
  'RC: Function / Purpose of a Part': { asks: 'Why the author includes a phrase or paragraph.' },
  'RC: Organization / Structure': { asks: 'How the passage is arranged.' },
  'RC: Analogy / Application': { asks: 'A new situation that matches something in the passage.' },
  'RC: Strengthen / Weaken': { asks: 'Information that affects a view in the passage.' },
  'RC: Comparative Passages': { asks: 'Relationship between Passage A and Passage B.' },
  'RC: Meaning in Context': { asks: 'What a word or phrase means as used.' }
};
const TRAPS = {
  'Out of Scope': 'Brings in information or topics the stimulus never touches.',
  'Reversed Logic': 'Flips a conditional (confuses sufficient and necessary).',
  'Too Extreme': "Uses absolute language (always, never, all) the text doesn't support.",
  'Half-Right / Half-Wrong': 'Starts accurate, then adds an error.',
  'Wrong Direction': 'Strengthens when asked to weaken, or vice versa.',
  'Restates Premise': 'Repeats a premise instead of doing the task (common in assumption Qs).',
  'Irrelevant Comparison': 'Compares things the argument never needs compared.',
  'Correlation vs Causation': 'Treats a correlation as proof of cause (or misses the flaw).',
  'Wrong Part of Passage': 'True of the passage, but not of the part the question asks about.',
  'Partially Supported': 'Some support, but not enough for a must-be-true question.',
  'Describes the Topic, Not the Structure': 'Matches content instead of reasoning (Method/Parallel Qs).',
  'Attractive Distractor (Real World)': "Sounds true in real life but isn't supported by the text.",
  'Misread Stem': 'Answered a different question than the one asked.',
  'Misread Stimulus': 'Missed or misunderstood a key word or claim.',
  'Time Pressure / Rushed': 'Knew how to do it; ran out of time or rushed.'
};
const FAMILIES = [
  { name: 'Argument structure', types: ['Main Point', 'Role of a Statement', 'Method of Reasoning', 'Flaw', 'Parallel Reasoning', 'Parallel Flaw'] },
  { name: 'Assumption family', types: ['Necessary Assumption', 'Sufficient Assumption', 'Strengthen', 'Weaken', 'Evaluate', 'Principle (Justify)'] },
  { name: 'Inference family', types: ['Must Be True / Inference', 'Most Strongly Supported', 'Point at Issue (Disagree)', 'Point of Agreement', 'Principle (Apply)', 'Resolve / Explain', 'Conditional Logic'] },
  { name: 'Reading Comprehension', types: Object.keys(TYPE_INFO).filter(t => t.startsWith('RC:')) }
];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr();
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const dayDiff = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 864e5); };
const pct = x => Math.round(x * 100) + '%';
const mmss = s => { const a = Math.abs(Math.round(s)); return Math.floor(a / 60) + ':' + pad(a % 60); };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastT;
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------- storage (all access wrapped) ---------- */
let storageOK = true;
function defaults() {
  return {
    v: 1,
    settings: { dailyGoal: 15, sessionLen: 5, timerOn: false, timerSec: 85, theme: 'dark', mix: 'all' },
    progress: {},   // id -> {times_seen,times_correct,last_seen,last_answer,last_confidence,next_review,srs_stage,mastered}
    attempts: [],   // one per answer
    days: {},       // 'YYYY-MM-DD' -> {n,c,xp,goal}
    streak: { current: 0, best: 0, lastGoalDate: null },
    xpTotal: 0
  };
}
function normalize(o) {
  const d = defaults();
  if (!o || typeof o !== 'object') return d;
  return {
    ...d, ...o,
    settings: { ...d.settings, ...(o.settings || {}) },
    streak: { ...d.streak, ...(o.streak || {}) },
    progress: (o.progress && typeof o.progress === 'object') ? o.progress : {},
    attempts: Array.isArray(o.attempts) ? o.attempts : [],
    days: (o.days && typeof o.days === 'object') ? o.days : {},
    xpTotal: Number(o.xpTotal) || 0
  };
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
  if (!raw) return defaults();
  try { return normalize(JSON.parse(raw)); } catch (e) { return defaults(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { if (storageOK) toast("Progress couldn't be saved on this device. Export a backup."); storageOK = false; }
}
let S = load();
let Q = [];          // questions
let QBY = {};        // id -> question
let qError = null;
let view = 'home';

/* ---------- derived ---------- */
function day(ds = today()) { return S.days[ds] || (S.days[ds] = { n: 0, c: 0, xp: 0, goal: false }); }
function streakNow() { const t = today(), l = S.streak.lastGoalDate; return (l === t || l === addDays(t, -1)) ? S.streak.current : 0; }
function dueList() { const t = today(); return Q.filter(q => { const p = S.progress[q.id]; return p && p.next_review && p.next_review <= t; }); }
function typeStats() {
  const m = {};
  for (const a of S.attempts) { const s = m[a.type] || (m[a.type] = { n: 0, c: 0, recent: [] }); s.n++; if (a.c) s.c++; s.recent.push(a.c); }
  return m;
}
function level(st) {
  if (!st || !st.n) return 0;
  const r = st.recent.slice(-20), acc = r.filter(Boolean).length / r.length;
  const vol = VOL_TIERS.filter(x => st.n >= x).length, at = ACC_TIERS.filter(x => acc >= x).length;
  return Math.min(vol, at);
}
function recentAcc(st) { const r = st.recent.slice(-20); return r.filter(Boolean).length / r.length; }
function bankCount(type) { return mixPool().filter(q => q.type === type).length; }

/* ---------- theme ---------- */
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const t = S.settings.theme;
  const dark = t === 'dark' || (t === 'system' && (!mq || mq.matches));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#0B0D10' : '#F6F7F9';
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

/* ---------- questions ---------- */
function validQ(q) {
  return q && q.id && q.stimulus && q.stem && q.choices && q.correct && q.choices[q.correct] != null && q.type;
}
async function loadQuestions() {
  try {
    const r = await fetch('questions.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const list = Array.isArray(j) ? j : (j.questions || []);
    QPUB = list.filter(validQ);
    const bad = list.length - QPUB.length;
    if (bad) console.warn(bad + ' question(s) skipped: missing required fields');
  } catch (e) { qError = e.message || String(e); }
  loadOwned();
  mergeQuestions();
}
let QPUB = [], QOWN = [];
function loadOwned() {
  let raw = null;
  try { raw = localStorage.getItem(OWNED_KEY); } catch (e) {}
  if (!raw) { QOWN = []; return; }
  try { const j = JSON.parse(raw); QOWN = (Array.isArray(j) ? j : (j.questions || [])).filter(validQ); } catch (e) { QOWN = []; }
}
function mergeQuestions() {
  const seen = new Set(QPUB.map(q => q.id));
  Q = QPUB.concat(QOWN.filter(q => !seen.has(q.id)));
  Q.forEach(q => { if (!TYPE_INFO[q.type]) console.warn('Unknown type label:', q.id, q.type); });
  QBY = Object.fromEntries(Q.map(q => [q.id, q]));
}
const isOwned = q => q.source === 'owned';
function mixPool() {
  const m = S.settings.mix;
  return m === 'owned' ? Q.filter(isOwned) : m === 'original' ? Q.filter(q => !isOwned(q)) : Q;
}
function importOwned(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { toast("That file isn't valid JSON"); return; }
  if (j && j.state && Array.isArray(j.state.attempts)) { importBackup(text); return; }   // it's a progress backup
  const list = (Array.isArray(j) ? j : (j && j.questions) || []).filter(validQ);
  if (!list.length) { toast('No valid questions found in that file'); return; }
  const merged = Object.fromEntries(QOWN.map(q => [q.id, q]));
  list.forEach(q => { merged[q.id] = q; });
  const all = Object.values(merged);
  try { localStorage.setItem(OWNED_KEY, JSON.stringify({ questions: all })); }
  catch (e) { toast("Not enough storage on this device for that file"); return; }
  QOWN = all; mergeQuestions(); render();
  toast(`Loaded ${list.length} questions · ${all.length} private questions on this device`, 3200);
}
function removeOwned() {
  if (!confirm(`Remove all ${QOWN.length} private questions from this device? Your progress on them is kept.`)) return;
  try { localStorage.removeItem(OWNED_KEY); } catch (e) {}
  QOWN = []; mergeQuestions(); render(); toast('Private questions removed');
}

/* ---------- answering: XP, streak, spaced repetition ---------- */
function bumpStreak(t) {
  const l = S.streak.lastGoalDate;
  if (l === t) return;
  S.streak.current = (l === addDays(t, -1)) ? S.streak.current + 1 : 1;
  S.streak.lastGoalDate = t;
  S.streak.best = Math.max(S.streak.best, S.streak.current);
}
function record(q, ans, conf, why, ms) {
  const t = today(), correct = ans === q.correct, lucky = correct && conf === 'Guess';
  let xp = correct ? XP.correct + (conf === 'Sure' ? XP.sureBonus : 0) : 0;
  const p = S.progress[q.id] || { times_seen: 0, times_correct: 0, last_seen: null, last_answer: null, last_confidence: null, next_review: null, srs_stage: null };
  const wasDue = !!(p.next_review && p.next_review <= t);
  p.times_seen++; if (correct) p.times_correct++;
  p.last_seen = t; p.last_answer = ans; p.last_confidence = conf;
  if (!correct || lucky) {
    if (lucky && wasDue && p.srs_stage != null) {
      p.next_review = addDays(t, INTERVALS[p.srs_stage]);          // guessed on review: repeat stage
    } else { p.srs_stage = 0; p.next_review = addDays(t, INTERVALS[0]); }
    p.mastered = false;
  } else if (wasDue) {
    const st = (p.srs_stage ?? 0) + 1;
    if (st >= INTERVALS.length) { p.srs_stage = null; p.next_review = null; p.mastered = true; }
    else { p.srs_stage = st; p.next_review = addDays(t, INTERVALS[st]); }
  }
  S.progress[q.id] = p;
  const d = day(t); d.n++; if (correct) d.c++; d.xp += xp;
  let goalNow = false;
  if (!d.goal && d.n >= S.settings.dailyGoal) { d.goal = true; goalNow = true; d.xp += XP.goal; xp += XP.goal; bumpStreak(t); }
  S.xpTotal += xp;
  S.attempts.push({ id: q.id, d: t, ts: Date.now(), a: ans, c: correct, conf, why, type: q.type, section: q.section, trap: correct ? null : ((q.traps && q.traps[ans]) || null), ms: Math.round(ms), rev: wasDue, xp });
  save();
  return { correct, lucky, xp, goalNow, next: p.next_review, mastered: !!p.mastered, wasDue };
}

/* ---------- session building ---------- */
function buildSession(n, type, preferReview) {
  const t = today(), P = id => S.progress[id];
  const pool = mixPool().filter(q => !type || q.type === type);
  const due = shuffle(pool.filter(q => { const p = P(q.id); return p && p.next_review && p.next_review <= t; }))
    .sort((a, b) => P(a.id).next_review.localeCompare(P(b.id).next_review));
  const unseen = shuffle(pool.filter(q => !P(q.id))).sort((a, b) => (a.difficulty || 3) - (b.difficulty || 3));
  const accOf = q => { const p = P(q.id); return p.times_seen ? p.times_correct / p.times_seen : 0; };
  const rest = pool.filter(q => { const p = P(q.id); return p && !(p.next_review && p.next_review <= t); })
    .sort((a, b) => (P(a.id).last_seen || '').localeCompare(P(b.id).last_seen || '') || accOf(a) - accOf(b));
  const revSlots = due.length ? Math.min(due.length, preferReview ? n : Math.max(1, Math.ceil(n * 0.4))) : 0;
  const pick = [...due.slice(0, revSlots), ...unseen.slice(0, n - revSlots)];
  for (const q of [...due.slice(revSlots), ...rest]) { if (pick.length >= n) break; if (!pick.includes(q)) pick.push(q); }
  const dueIds = new Set(due.map(q => q.id));
  return shuffle(pick).map(q => ({ q, review: dueIds.has(q.id) }));
}

/* =========================================================
   VIEWS
   ========================================================= */
const ICON = {
  fire: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.2-.6 5-2 6.6C8.6 10.2 7 12 7 14.6A5 5 0 0 0 12 20a5 5 0 0 0 5-5.2c0-2.3-1.2-3.8-2.2-4.9-.2 1.3-.9 2.3-1.9 2.8.6-3.3-.2-7.4-.9-10.7z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>'
};
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === view));
  const v = $('#view');
  v.innerHTML = view === 'home' ? homeHTML() : view === 'skills' ? skillsHTML() : view === 'stats' ? statsHTML() : settingsHTML();
  window.scrollTo(0, 0);
}

function homeHTML() {
  const d = S.days[today()] || { n: 0, xp: 0, goal: false };
  const g = S.settings.dailyGoal, frac = Math.min(1, d.n / g), C = 2 * Math.PI * 52;
  const st = streakNow(), due = dueList().length, n = S.settings.sessionLen;
  let suggest = '';
  const ts = typeStats();
  const weak = Object.entries(ts).filter(([t, s]) => s.n >= 3 && bankCount(t) > 0).sort((a, b) => recentAcc(a[1]) - recentAcc(b[1]))[0];
  if (weak && recentAcc(weak[1]) < 0.8) {
    suggest = `<div class="panel suggest"><div class="t"><b>Weakest: ${esc(weak[0])}</b><span>${pct(recentAcc(weak[1]))} over your last ${Math.min(20, weak[1].n)} · ${bankCount(weak[0])} in bank</span></div><button data-a="drill" data-type="${esc(weak[0])}">Drill</button></div>`;
  }
  const qerr = qError ? `<div class="panel err">Couldn't load questions.json (${esc(qError)}). Connect to the internet once and reopen.</div>` : '';
  return `
  <div class="vh"><h1>LSAT Swipe</h1>
    <span class="chip ${st ? 'fire' : 'dim'}" title="Streak">${ICON.fire}<span class="tnum">${st}</span></span></div>
  ${qerr}
  <div class="panel goal">
    <div class="ring ${d.goal ? 'done' : ''}"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="10"/><circle class="val" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>
      <div class="lbl"><b class="tnum">${d.n}</b><span>of ${g} today</span></div></div>
    <div class="kv">
      <div><span>Today's XP</span><b class="xpv tnum">${d.xp}</b></div>
      <div><span>Streak</span><b class="tnum">${st} day${st === 1 ? '' : 's'}${d.goal ? ' ✓' : ''}</b></div>
      <div><span>Reviews due</span><b class="tnum">${due}</b></div>
      <div><span>Total XP</span><b class="tnum">${S.xpTotal}</b></div>
    </div>
  </div>
  ${d.goal ? '' : `<p class="sub">${g - d.n} more to hit today's goal${st ? ' and keep the streak' : ' and start a streak'}.</p>`}
  ${suggest}
  <div class="cta">
    <button class="btn primary" data-a="start" ${Q.length ? '' : 'disabled'}>Start<span class="bsub">${n} questions${due ? ` · ${Math.min(due, Math.max(1, Math.ceil(n * .4)))} review${due > 1 ? 's' : ''} mixed in` : ''}</span></button>
    <button class="btn ghost" data-a="quick" ${Q.length ? '' : 'disabled'}>Quick 3</button>
  </div>`;
}

function skillsHTML() {
  const ts = typeStats();
  const fam = FAMILIES.map(f => {
    const nodes = f.types.map(t => {
      const s = ts[t], lv = level(s), cnt = bankCount(t), lock = cnt === 0;
      const line = lock ? 'No questions yet' : s ? `${pct(recentAcc(s))} · ${s.n} answered · ${cnt} in bank` : `Not started · ${cnt} in bank`;
      return `<button class="node ${lock ? 'lock' : ''}" ${lock ? 'disabled' : `data-a="drill" data-type="${esc(t)}"`}>
        <div class="nm"><b>${esc(t.replace(/^RC: /, ''))}</b><span>${line}</span></div>
        <div class="lv"><b>Lv ${lv}</b><div class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= lv ? 'f' : ''}"></i>`).join('')}</div></div></button>`;
    }).join('');
    return `<section class="fam"><h3>${esc(f.name)}</h3><div class="branch">${nodes}</div></section>`;
  }).join('');
  return `<div class="vh"><h1>Skills</h1></div>
  <p class="sub">Tap a skill to drill only that type. Level = volume and recent accuracy, whichever is lower.</p>${fam}`;
}

function trendSVG() {
  const days = [];
  for (let i = 13; i >= 0; i--) { const ds = addDays(today(), -i), d = S.days[ds] || { n: 0, c: 0 }; days.push({ ds, n: d.n, c: d.c }); }
  const W = 340, H = 160, pl = 4, pr = 32, pt = 10, pb = 22, iw = W - pl - pr, ih = H - pt - pb, bw = iw / 14;
  const g = S.settings.dailyGoal, maxN = Math.max(g, ...days.map(d => d.n));
  let bars = '', pts = [];
  days.forEach((d, i) => {
    const x = pl + i * bw, h = d.n / maxN * ih;
    if (d.n) bars += `<rect class="cb" x="${(x + bw * .2).toFixed(1)}" y="${(pt + ih - h).toFixed(1)}" width="${(bw * .6).toFixed(1)}" height="${Math.max(2, h).toFixed(1)}" rx="2"/>`;
    if (d.n) pts.push([x + bw / 2, pt + ih - (d.c / d.n) * ih]);
  });
  const gy = pt + ih - g / maxN * ih;
  const line = pts.length > 1 ? `<path class="cl" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}"/>` : '';
  const dots = pts.map(p => `<circle class="cd" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join('');
  const md = s => { const [, m, d] = s.split('-'); return +m + '/' + +d; };
  const yl = [0, .5, 1].map(f => `<text x="${W - 2}" y="${(pt + ih - f * ih + 3).toFixed(1)}" text-anchor="end">${f * 100}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Questions and accuracy, last 14 days">
    <line class="cg" x1="${pl}" x2="${W - pr}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}"/>
    ${bars}${line}${dots}${yl}
    <text x="${pl}" y="${H - 5}">${md(days[0].ds)}</text><text x="${W - pr}" y="${H - 5}" text-anchor="end">Today</text></svg>`;
}

function statsHTML() {
  const A = S.attempts, n = A.length, c = A.filter(a => a.c).length;
  if (!n) return `<div class="vh"><h1>Stats</h1></div><div class="panel"><p class="empty">No answers yet. Finish a session and your accuracy, traps and trend show up here.</p></div>`;
  const ts = typeStats();
  const typeRows = Object.entries(ts).sort((a, b) => b[1].n - a[1].n).map(([t, s]) => `
    <div class="row"><div class="top"><b>${esc(t)}</b><span class="tnum">${pct(s.c / s.n)} · ${s.c}/${s.n}</span></div><div class="bar"><i style="width:${s.c / s.n * 100}%"></i></div></div>`).join('');
  const trapCount = {}; A.forEach(a => { if (!a.c && a.trap) trapCount[a.trap] = (trapCount[a.trap] || 0) + 1; });
  const miss = n - c, traps = Object.entries(trapCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxT = traps.length ? traps[0][1] : 1;
  const trapRows = traps.length ? traps.map(([t, k]) => `
    <div class="row"><div class="top"><b>${esc(t)}</b><span class="tnum">${k}×</span></div><div class="bar bad"><i style="width:${k / maxT * 100}%"></i></div><p>${esc(TRAPS[t] || '')}</p></div>`).join('') : '<p class="empty">No misses yet.</p>';
  const cal = CONF.map(cf => { const r = A.filter(a => a.conf === cf); return r.length ? `<div class="row"><div class="top"><b>${cf}</b><span class="tnum">${pct(r.filter(a => a.c).length / r.length)} right · ${r.length}</span></div><div class="bar"><i style="width:${r.filter(a => a.c).length / r.length * 100}%"></i></div></div>` : ''; }).join('');
  const whyMiss = {}; A.filter(a => !a.c).forEach(a => { whyMiss[a.why] = (whyMiss[a.why] || 0) + 1; });
  const whyRows = Object.entries(whyMiss).sort((a, b) => b[1] - a[1]).map(([w, k]) => `<div class="row"><div class="top"><span style="color:var(--tx)">${esc(w)}</span><span class="tnum">${k}</span></div></div>`).join('') || '<p class="empty">No misses yet.</p>';
  const P = Object.entries(S.progress).filter(([id]) => QBY[id]);
  const t = today(), dueN = P.filter(([, p]) => p.next_review && p.next_review <= t).length;
  const sched = P.filter(([, p]) => p.next_review && p.next_review > t).length, mast = P.filter(([, p]) => p.mastered).length;
  const seen = P.length;
  return `<div class="vh"><h1>Stats</h1></div>
  <div class="tiles">
    <div class="tile"><b class="tnum">${n}</b><span>Questions answered</span></div>
    <div class="tile"><b class="tnum">${pct(c / n)}</b><span>Overall accuracy</span></div>
    <div class="tile"><b class="tnum">${seen}/${Q.length}</b><span>Bank questions seen</span></div>
    <div class="tile"><b class="tnum">${S.streak.best}</b><span>Best streak</span></div>
  </div>
  <div class="panel chart"><h3>Last 14 days</h3>${trendSVG()}
    <div class="legend"><span><i style="background:var(--mu);opacity:.4"></i>Questions/day</span><span><i style="background:var(--ac)"></i>Accuracy</span><span>--- Daily goal</span></div></div>
  <div class="panel"><h3>Accuracy by question type</h3><div class="rows">${typeRows}</div></div>
  <div class="panel"><h3>Traps you fall for · ${miss} miss${miss === 1 ? '' : 'es'}</h3><div class="rows">${trapRows}</div></div>
  <div class="panel"><h3>Confidence check</h3><div class="rows">${cal}</div><p class="fine" style="margin-top:10px">"Sure" should be near 100%. If it isn't, you're confident about the wrong things.</p></div>
  <div class="panel"><h3>Why you picked wrong answers</h3><div class="rows">${whyRows}</div></div>
  <div class="panel"><h3>Review queue</h3><div class="tiles">
    <div class="tile"><b class="tnum">${dueN}</b><span>Due now</span></div>
    <div class="tile"><b class="tnum">${sched}</b><span>Scheduled</span></div>
    <div class="tile"><b class="tnum">${mast}</b><span>Mastered</span></div>
    <div class="tile"><b class="tnum">${Q.length - seen}</b><span>Unseen</span></div></div></div>`;
}

  const seg = (k, vals, labels) => `<div class="segsm">${vals.map((v, i) => `<button class="${s[k] === v ? 'on' : ''}" data-a="set" data-k="${k}" data-v="${v}">${labels ? labels[i] : v}</button>`).join('')}</div>`;

/* =========================================================
   FEED
   ========================================================= */
let F = null, timerId = null, importMode = 'backup';

function startSession(kind, type) {
  const n = kind === 'quick' ? 3 : S.settings.sessionLen;
  const items = buildSession(n, type || null, kind === 'quick');
  if (!items.length) { toast('No questions available for that yet.'); return; }
  F = { kind, type: type || null, items, i: -1, cur: null, results: [], xp: 0, goalNow: false, finished: false };
  $('#feed').hidden = false; document.body.style.overflow = 'hidden';
  $('#deck').innerHTML = '';
  $('#segs').innerHTML = items.map(() => '<i></i>').join('');
  showCard(0);
}
function closeFeed() {
  stopTimer(); $('#feed').hidden = true; document.body.style.overflow = ''; F = null; render();
}
function updateSegs() {
  const segs = $('#segs').children;
  F.items.forEach((_, i) => {
    const r = F.results[i];
    segs[i].className = r ? (r.correct ? 'ok' : 'bad') : (i === F.i ? 'cur' : '');
  });
}
function paras(t) { return String(t).split(/\n+/).map(p => /^Passage [AB]$/.test(p.trim()) ? `<h5>${esc(p)}</h5>` : `<p>${esc(p)}</p>`).join(''); }
function dots(d) { d = Math.max(1, Math.min(5, d || 3)); return `<span class="dots" title="Difficulty ${d}/5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= d ? 'f' : ''}"></i>`).join('')}</span>`; }

function cardHTML(item) {
  const q = item.q, keys = ['A', 'B', 'C', 'D', 'E'].filter(k => q.choices[k] != null);
  return `<div class="scroller"><div class="inner">
    <div class="meta"><span class="pill">${esc(q.type.replace(/^RC: /, 'RC · '))}</span>${dots(q.difficulty)}${item.review ? '<span class="badge">Review</span>' : ''}${isOwned(q) ? '<span class="badge real">Real</span>' : ''}<span class="qid">${esc(q.id)}</span></div>
    ${q.section === 'RC' ? `<div class="rchead"><span>Passage${q.rc_passage_topic ? ' · ' + esc(q.rc_passage_topic) : ''}</span><button data-a="jump">Question ↓</button></div>` : ''}
    <div class="stim ${q.section === 'RC' ? 'rc' : ''}">${paras(q.stimulus)}</div>
    <p class="stem">${esc(q.stem)}</p>
    <div class="choices">${keys.map(k => `<button class="ch" data-a="pick" data-k="${k}"><span class="k">${k}</span><span class="t">${esc(q.choices[k])}</span></button>`).join('')}</div>
    <div class="commit" hidden>
      <h4>How sure are you?</h4>
      <div class="seg">${CONF.map(c => `<button data-a="conf" data-v="${c}">${c}</button>`).join('')}</div>
      <h4>Why did you pick it?</h4>
      <div class="chips">${WHY.map(w => `<button data-a="why" data-v="${esc(w)}">${esc(w)}</button>`).join('')}</div>
    </div>
    <div class="reveal" hidden></div>
    <div class="swipehint" hidden>${ICON.up}Swipe up for next</div>
  </div></div>
  <div class="actionbar"><button class="btn primary" data-a="act" disabled>Lock in</button></div>`;
}

function mountCard(html, onReady) {
  const deck = $('#deck'), old = deck.querySelector('.card:not(.leave)');
  const el = document.createElement('article');
  el.className = 'card enter'; el.innerHTML = html;
  deck.appendChild(el);
  attachSwipe(el);
  el.getBoundingClientRect();           // force layout so the transition runs
  requestAnimationFrame(() => el.classList.remove('enter'));
  if (old) { old.classList.add('leave'); setTimeout(() => old.remove(), 380); }
  if (onReady) onReady(el);
  return el;
}

function showCard(i) {
  F.i = i;
  const item = F.items[i];
  const el = mountCard(cardHTML(item));
  F.cur = { el, item, sel: null, locked: false, conf: null, why: null, revealed: false, t0: performance.now(), ms: 0 };
  updateSegs();
  startTimer();
}

function startTimer() {
  stopTimer();
  const on = S.settings.timerOn, ft = $('#ftime'), tb = $('#tbar');
  ft.textContent = ''; ft.classList.remove('over'); tb.classList.remove('over'); tb.firstElementChild.style.width = on ? '100%' : '0';
  if (!on) return;
  const lim = S.settings.timerSec + (F && F.cur && F.cur.item && F.cur.item.q.section === 'RC' ? 35 : 0);
  const tick = () => {
    if (!F || !F.cur || F.cur.locked) return;
    const el = (performance.now() - F.cur.t0) / 1000, left = lim - el;
    ft.textContent = left >= 0 ? mmss(left) : '+' + mmss(-left);
    const over = left < 0;
    ft.classList.toggle('over', over); tb.classList.toggle('over', over);
    tb.firstElementChild.style.width = (over ? 100 : Math.max(0, left / lim * 100)) + '%';
  };
  tick(); timerId = setInterval(tick, 250);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function setAct(label, enabled) { const b = F.cur.el.querySelector('[data-a=act]'); b.textContent = label; b.disabled = !enabled; }

function pick(k) {
  const c = F.cur; if (!c || c.locked || c.revealed) return;
  c.sel = k;
  c.el.querySelectorAll('.ch').forEach(b => b.classList.toggle('sel', b.dataset.k === k));
  setAct('Lock in', true);
}
function lockIn() {
  const c = F.cur; if (!c.sel) return;
  c.locked = true; c.ms = performance.now() - c.t0; stopTimer();
  c.el.querySelectorAll('.ch').forEach(b => { b.classList.add('locked'); b.disabled = true; });
  const cm = c.el.querySelector('.commit'); cm.hidden = false;
  setAct('Reveal', false);
  setTimeout(() => cm.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}
function setCommit(kind, v) {
  const c = F.cur; if (!c || !c.locked || c.revealed) return;
  c[kind] = v;
  const box = c.el.querySelector(kind === 'conf' ? '.seg' : '.chips');
  box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  setAct('Reveal', !!(c.conf && c.why));
  if (kind === 'conf' && !c.why) c.el.querySelector('.chips').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function explHTML(text) {
  return String(text || '').split(/\n+/).map(line => {
    const m = line.match(/^([A-E])\s*[—–-]\s*(.*)$/);
    return m ? `<p class="wl"><b>${m[1]}</b><span>${esc(m[2])}</span></p>` : `<p>${esc(line)}</p>`;
  }).join('');
}

function reveal() {
  const c = F.cur, q = c.item.q;
  if (!c.conf || !c.why) { c.el.querySelector('.commit').classList.add('shake'); setTimeout(() => c.el.querySelector('.commit').classList.remove('shake'), 400); return; }
  c.revealed = true;
  const r = record(q, c.sel, c.conf, c.why, c.ms);
  F.results[F.i] = { q, ans: c.sel, correct: r.correct, trap: r.correct ? null : (q.traps || {})[c.sel] };
  F.xp += r.xp; if (r.goalNow) F.goalNow = true;
  c.el.querySelector('.commit').hidden = true;
  // color choices + trap tags on every wrong choice
  c.el.querySelectorAll('.ch').forEach(b => {
    const k = b.dataset.k, tr = (q.traps || {})[k];
    b.classList.remove('sel');
    if (k === q.correct) b.classList.add('ok');
    else if (k === c.sel) b.classList.add('bad');
    else b.classList.add('dim');
    if (k !== q.correct && tr) b.querySelector('.t').insertAdjacentHTML('beforeend', `<br><span class="trap">${esc(tr)}</span>`);
  });
  const trap = (q.traps || {})[c.sel];
  let h = r.correct
    ? `<div class="verdict ok"><div>Correct<span class="vs">${esc(c.conf)} · ${esc(c.why)}</span></div><small>+${r.xp} XP</small></div>`
    : `<div class="verdict bad"><div>Incorrect<span class="vs">You chose ${c.sel} · answer is ${q.correct}</span></div></div>`;
  if (!r.correct && trap) h += `<div class="box trapbox"><h4>Trap you fell for</h4><div class="tn">${esc(trap)}</div>${esc(TRAPS[trap] || '')}</div>`;
  if (!r.correct && c.conf === 'Sure') h += `<div class="box note"><b>You were Sure and wrong.</b> That's the costliest kind of miss — the reasoning felt solid and wasn't.</div>`;
  if (r.lucky) h += `<div class="box note"><b>Right, but you guessed.</b> Counted as a lucky guess — it comes back for review.</div>`;
  if (S.settings.timerOn && c.ms / 1000 > S.settings.timerSec) h += `<div class="box">Took ${mmss(c.ms / 1000)} — ${mmss(c.ms / 1000 - S.settings.timerSec)} over your target.</div>`;
  h += `<h4>Explanation</h4><div class="box expl">${explHTML(q.explanation)}</div>`;
  const info = TYPE_INFO[q.type];
  if (info && info.approach) h += `<div class="box"><b>${esc(q.type)}:</b> ${esc(info.approach)}</div>`;
  const nx = r.next ? dayDiff(today(), r.next) : null;
  h += `<p class="srs">${r.mastered && !r.next ? 'Mastered — out of the review rotation.' : nx ? `Back for review in ${nx} day${nx === 1 ? '' : 's'}.` : 'Not scheduled for review.'}</p>`;
  if (r.goalNow) h += `<div class="box note"><b>Daily goal hit.</b> +${XP.goal} XP · streak ${streakNow()} day${streakNow() === 1 ? '' : 's'}.</div>`;
  const rv = c.el.querySelector('.reveal'); rv.innerHTML = h; rv.hidden = false;
  c.el.querySelector('.swipehint').hidden = false;
  setAct(F.i + 1 < F.items.length ? 'Next' : 'Finish', true);
  updateSegs();
  if (r.xp > 0) { const f = document.createElement('div'); f.className = 'xpfloat'; f.textContent = `+${r.xp} XP`; c.el.appendChild(f); setTimeout(() => f.remove(), 1400); }
  setTimeout(() => rv.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function next() {
  if (!F) return;
  if (F.finished) { startSession(F.kind, F.type); return; }
  if (!F.cur || !F.cur.revealed) return;
  if (F.i + 1 < F.items.length) showCard(F.i + 1); else showSummary();
}

function showSummary() {
  stopTimer();
  F.finished = true;
  const d = day(); d.xp += XP.session; S.xpTotal += XP.session; F.xp += XP.session; save();
  const n = F.results.filter(Boolean).length, c = F.results.filter(r => r && r.correct).length;
  const misses = F.results.filter(r => r && !r.correct);
  const g = S.settings.dailyGoal, st = streakNow();
  const ml = misses.length ? `<h4 style="margin:6px 0 10px">Missed</h4><div class="misslist">${misses.map(m => `<div><b>${esc(m.q.type)}</b><span>${esc(m.trap || '—')}</span></div>`).join('')}</div><p class="fine" style="margin-top:10px">Missed questions return tomorrow.</p>` : '';
  const html = `<div class="scroller"><div class="inner sum">
    <h2>${c === n ? 'Clean sweep.' : 'Session done.'}</h2>
    <p class="sub">${d.goal ? `Daily goal done · streak ${st} day${st === 1 ? '' : 's'}` : `${Math.max(0, g - d.n)} more today to hit your goal`}</p>
    <div class="big3"><div><b class="tnum">${c}/${n}</b><span>Correct</span></div><div><b class="tnum" style="color:var(--xp)">+${F.xp}</b><span>XP</span></div><div><b class="tnum">${d.n}/${g}</b><span>Today</span></div></div>
    ${ml}
    <div style="margin-top:18px"><button class="btn ghost" data-a="close">Done</button></div>
    <div class="swipehint">${ICON.up}Swipe up to keep going</div>
  </div></div>
  <div class="actionbar"><button class="btn primary" data-a="act">Keep going</button></div>`;
  const el = mountCard(html);
  F.cur = { el, summary: true, revealed: true };
  $('#ftime').textContent = ''; $('#tbar').firstElementChild.style.width = '0';
}

function act() {
  const c = F && F.cur; if (!c) return;
  if (c.summary) return next();
  if (!c.locked) return lockIn();
  if (!c.revealed) return reveal();
  next();
}

/* swipe up at the bottom of a card → next */
function attachSwipe(card) {
  const sc = card.querySelector('.scroller');
  let y0 = null, x0 = 0, atBottom = false, dy = 0;
  sc.addEventListener('touchstart', e => {
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0;
    atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 6;
  }, { passive: true });
  sc.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (atBottom && dy < 0 && F && F.cur && F.cur.revealed) {
      card.classList.add('drag');
      card.style.transform = `translateY(${Math.max(dy * .4, -90)}px)`;
    }
  }, { passive: true });
  sc.addEventListener('touchend', e => {
    if (y0 == null) return;
    const dx = Math.abs((e.changedTouches[0] || {}).clientX - x0 || 0);
    card.classList.remove('drag'); card.style.transform = '';
    if (atBottom && dy < -70 && Math.abs(dy) > dx && F && F.cur) {
      if (F.cur.revealed) next();
      else { toast(F.cur.locked ? 'Pick confidence and a reason, then Reveal' : 'Lock in an answer first', 1600); }
    }
    y0 = null;
  }, { passive: true });
}

/* =========================================================
   BACKUP
   ========================================================= */
function backupJSON() { return JSON.stringify({ app: 'lsat-swipe', version: APP_VERSION, exported: new Date().toISOString(), state: S }, null, 1); }
async function exportBackup() {
  const name = `lsat-swipe-backup-${today()}.json`, data = backupJSON();
  try {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup downloaded');
  } catch (e) { toast("Couldn't export — use Copy backup instead"); }
}
async function copyBackup() {
  try { await navigator.clipboard.writeText(backupJSON()); toast('Backup copied — paste it into Notes or Files'); }
  catch (e) { toast("Clipboard blocked — use Export instead"); }
}
function importBackup(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { toast("That file isn't valid JSON"); return; }
  const st = o && o.state ? o.state : o;
  if (!st || typeof st !== 'object' || !('progress' in st) || !Array.isArray(st.attempts)) { toast("That doesn't look like an LSAT Swipe backup"); return; }
  const when = o.exported ? new Date(o.exported).toLocaleDateString() : 'unknown date';
  if (!confirm(`Replace current progress with the backup from ${when} (${st.attempts.length} answers)?`)) return;
  S = normalize(st); save(); applyTheme(); render(); toast('Backup restored');
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a.startsWith('tab:')) { view = a.slice(4); render(); return; }
  switch (a) {
    case 'start': startSession('start'); break;
    case 'quick': startSession('quick'); break;
    case 'drill': startSession('drill', b.dataset.type); break;
    case 'close': closeFeed(); break;
    case 'pick': pick(b.dataset.k); break;
    case 'conf': setCommit('conf', b.dataset.v); break;
    case 'why': setCommit('why', b.dataset.v); break;
    case 'act': act(); break;
    case 'jump': { const st = F && F.cur && F.cur.el.querySelector('.stem'); if (st) st.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'goal': S.settings.dailyGoal = Math.max(1, Math.min(100, S.settings.dailyGoal + +b.dataset.d)); save(); render(); break;
    case 'tsec': S.settings.timerSec = Math.max(30, Math.min(300, S.settings.timerSec + +b.dataset.d)); save(); render(); break;
    case 'timer': S.settings.timerOn = !S.settings.timerOn; save(); render(); break;
    case 'set': { const k = b.dataset.k, v = b.dataset.v; S.settings[k] = k === 'sessionLen' ? +v : v; save(); if (k === 'theme') applyTheme(); render(); if (k === 'mix' && !mixPool().length) toast('No questions in that bank yet'); break; }
    case 'export': exportBackup(); break;
    case 'copy': copyBackup(); break;
    case 'import': importMode = 'backup'; $('#importFile').click(); break;
    case 'importOwned': importMode = 'owned'; $('#importFile').click(); break;
    case 'removeOwned': removeOwned(); break;
    case 'reset':
      if (confirm('Erase all progress, XP, streaks and stats on this device?') && confirm('This cannot be undone. Reset now?')) {
        const keep = S.settings; S = defaults(); S.settings = keep; save(); render(); toast('Progress reset');
      } break;
  }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => (importMode === 'owned' ? importOwned(r.result) : importBackup(r.result)); r.onerror = () => toast("Couldn't read that file"); r.readAsText(f);
  e.target.value = '';
});
// keyboard (handy when testing on a laptop)
document.addEventListener('keydown', e => {
  if (!F || !F.cur || $('#feed').hidden) return;
  const k = e.key.toUpperCase();
  if ('ABCDE'.includes(k) && k.length === 1 && !F.cur.locked && !F.cur.summary) pick(k);
  else if (['1', '2', '3'].includes(e.key) && F.cur.locked && !F.cur.revealed) setCommit('conf', CONF[+e.key - 1]);
  else if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); const btn = F.cur.el.querySelector('[data-a=act]'); if (btn && !btn.disabled) act(); }
  else if (e.key === 'Escape') closeFeed();
});
// re-render home when the app comes back to the foreground (date may have changed)
document.addEventListener('visibilitychange', () => { if (!document.hidden && !F) render(); });

/* ---------- boot ---------- */
(async function boot() {
  applyTheme();
  render();
  await loadQuestions();
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  }
})();
</script>
